<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5e72e4">
<title>셀러 순이익 계산기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235e72e4'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%82%A9%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#5e72e4;
    --primary-grad:linear-gradient(135deg,#5e72e4 0%,#825ee4 100%);
    --pink:#fd5d93;
    --cyan:#11cdef;
    --green:#2dce89;
    --red:#f5365c;
    --text:#32325d;
    --muted:#8898aa;
    --bg:#f8f9fe;
    --card:#ffffff;
    --border:#e9ecf5;
    --shadow:0 7px 14px rgba(50,50,93,0.08),0 3px 6px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:150px;
  }
  header{
    background:var(--primary-grad);
    color:#fff;
    padding:28px 20px 40px;
    text-align:center;
    border-radius:0 0 28px 28px;
  }
  header h1{font-size:22px;font-weight:900;}
  header p{font-size:13px;opacity:.9;margin-top:6px;line-height:1.5;}
  main{max-width:520px;margin:-22px auto 0;padding:0 16px;}
  .card{
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:16px;
  }
  .card h2{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .card h2 small{font-weight:400;color:var(--muted);font-size:11px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1.5px solid var(--border);
    background:#fff;
    color:var(--text);
    padding:9px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:.15s;
    font-family:inherit;
  }
  .chip.active{
    background:var(--primary-grad);
    color:#fff;
    border-color:transparent;
  }

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px;
  }
  .field label .hint{font-size:11px;color:var(--muted);font-weight:400;}
  .input-wrap{position:relative;}
  .input-wrap input{
    width:100%;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:12px 44px 12px 14px;
    font-size:17px;
    font-weight:700;
    color:var(--text);
    font-family:inherit;
    text-align:right;
  }
  .input-wrap input:focus{outline:none;border-color:var(--primary);}
  .input-wrap .unit{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:13px;font-weight:500;pointer-events:none;
  }

  .toggle-row{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px;}
  .toggle-row button{
    flex:1;border:none;background:transparent;padding:9px 0;border-radius:9px;
    font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;
  }
  .toggle-row button.active{background:#fff;color:var(--primary);box-shadow:0 2px 4px rgba(50,50,93,.1);}
  .toggle-row.small button{padding:7px 0;font-size:12px;}

  .input-wrap input[readonly]{background:var(--bg);color:var(--primary);}
  .sub-card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:14px;}
  .sub-card .field{margin-bottom:10px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;}
  .stat{
    background:var(--bg);border-radius:14px;padding:14px;text-align:center;
  }
  .stat .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .stat .value{font-size:19px;font-weight:900;}
  .stat.pos .value{color:var(--green);}
  .stat.neg .value{color:var(--red);}

  .result-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:#fff;
    border-top:1px solid var(--border);
    box-shadow:0 -6px 20px rgba(50,50,93,.1);
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;align-items:center;
    max-width:520px;margin:0 auto;
  }
  .result-bar .rb-label{font-size:12px;color:var(--muted);}
  .result-bar .rb-value{font-size:24px;font-weight:900;}
  .result-bar .rb-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .result-bar.pos .rb-value{color:var(--green);}
  .result-bar.neg .rb-value{color:var(--red);}
  .result-bar button{
    background:var(--primary-grad);color:#fff;border:none;border-radius:12px;
    padding:13px 20px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  }

  .note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px;}

  .saved-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .saved-item:last-child{border-bottom:none;}
  .saved-item .si-name{font-size:14px;font-weight:700;}
  .saved-item .si-plat{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .saved-item .si-right{text-align:right;}
  .saved-item .si-profit{font-size:14px;font-weight:800;}
  .saved-item .si-margin{font-size:11.5px;color:var(--muted);}
  .saved-item .si-del{
    margin-left:10px;background:none;border:none;color:var(--red);font-size:18px;
    cursor:pointer;padding:4px 6px;font-family:inherit;
  }
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0;}

  .save-form{display:flex;gap:8px;margin-top:12px;}
  .save-form input{
    flex:1;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;
    font-size:14px;font-family:inherit;
  }
  .save-form button{
    background:var(--text);color:#fff;border:none;border-radius:12px;padding:0 16px;
    font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>셀러 순이익 계산기</h1>
  <p>사입가, 수수료, 배송비까지 빼고<br>진짜 남는 돈을 한눈에</p>
</header>

<main>

  <div class="card">
    <h2>판매 플랫폼 <small>탭하면 수수료율 자동 입력</small></h2>
    <div class="chips" id="platformChips"></div>
  </div>

  <div class="card">
    <h2>계산 방식</h2>
    <div class="toggle-row">
      <button id="modeForward" class="active">판매가 → 순이익</button>
      <button id="modeReverse">목표 마진율 → 판매가</button>
    </div>

    <div class="toggle-row small">
      <button id="costModeDirect" class="active">사입가 직접입력</button>
      <button id="costModeImport">1688·배대지·통관 계산</button>
    </div>

    <div class="sub-card" id="importCostCard" style="display:none;">
      <div class="field">
        <label>1688 금액</label>
        <div class="input-wrap">
          <input type="text" inputmode="numeric" id="cnyAmount" placeholder="0">
          <span class="unit">위안(¥)</span>
        </div>
      </div>
      <div class="field">
        <label>적용 환율 <span class="hint">그날 환율로 직접 확인 후 입력</span></label>
        <div class="input-wrap">
          <input type="number" inputmode="decimal" id="exchangeRate" placeholder="예: 195" step="0.1">
          <span class="unit">원/¥</span>
        </div>
      </div>
      <div class="field">
        <label>배대지 비용</label>
        <div class="input-wrap">
          <input type="text" inputmode="numeric" id="forwarding" placeholder="0">
          <span class="unit">원</span>
        </div>
      </div>
      <div class="field">
        <label>통관비용 <span class="hint">관세·부가세 등</span></label>
        <div class="input-wrap">
          <input type="text" inputmode="numeric" id="customs" placeholder="0">
          <span class="unit">원</span>
        </div>
      </div>
      <p class="note">위안화 금액 × 환율 + 배대지 비용 + 통관비용 = 사입가로 자동 반영됨</p>
    </div>

    <div class="field">
      <label>사입가(원가)</label>
      <div class="input-wrap">
        <input type="text" inputmode="numeric" id="cost" placeholder="0">
        <span class="unit">원</span>
      </div>
    </div>

    <div class="field" id="priceField">
      <label>판매가</label>
      <div class="input-wrap">
        <input type="text" inputmode="numeric" id="price" placeholder="0">
        <span class="unit">원</span>
      </div>
    </div>

    <div class="field" id="targetMarginField" style="display:none;">
      <label>목표 마진율</label>
      <div class="input-wrap">
        <input type="number" inputmode="decimal" id="targetMargin" placeholder="0" step="0.5">
        <span class="unit">%</span>
      </div>
    </div>

    <div class="field">
      <label>수수료율 <span class="hint">플랫폼 정산내역 기준 실제값으로 수정</span></label>
      <div class="input-wrap">
        <input type="number" inputmode="decimal" id="fee" placeholder="0" step="0.1">
        <span class="unit">%</span>
      </div>
    </div>

    <div class="field">
      <label>택배비(배송비)</label>
      <div class="input-wrap">
        <input type="text" inputmode="numeric" id="shipping" placeholder="0">
        <span class="unit">원</span>
      </div>
    </div>

    <div class="field">
      <label>기타비용 <span class="hint">부자재·포장비 등</span></label>
      <div class="input-wrap">
        <input type="text" inputmode="numeric" id="etc" placeholder="0">
        <span class="unit">원</span>
      </div>
    </div>

    <div class="field">
      <label>수량</label>
      <div class="input-wrap">
        <input type="text" inputmode="numeric" id="qty" value="1">
        <span class="unit">개</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>결과</h2>
    <div class="stat-grid">
      <div class="stat" id="statMargin">
        <div class="label">마진율</div>
        <div class="value" id="outMargin">0%</div>
      </div>
      <div class="stat" id="statBreakeven">
        <div class="label">손익분기 판매가</div>
        <div class="value" id="outBreakeven">0원</div>
      </div>
    </div>
    <p class="note" id="calcError"></p>

    <div class="save-form">
      <input type="text" id="itemName" placeholder="상품명 (예: 여름 원피스)">
      <button id="saveBtn">저장</button>
    </div>
  </div>

  <div class="card">
    <h2>저장한 상품</h2>
    <div id="savedList"><div class="empty">아직 저장한 상품이 없어</div></div>
  </div>

</main>

<div class="result-bar pos" id="resultBar">
  <div>
    <div class="rb-label">개당 순이익</div>
    <div class="rb-value" id="rbProfit">0원</div>
    <div class="rb-sub" id="rbTotal">수량 1개 · 총 0원</div>
  </div>
  <button id="rbSaveBtn">저장</button>
</div>

<script>
const PLATFORMS = [
  { name: '스마트스토어', fee: 5.85 },
  { name: '쿠팡', fee: 10.8 },
  { name: '에이블리', fee: 10 },
  { name: '지그재그', fee: 5 },
  { name: '브랜디', fee: 10 },
  { name: '오늘의집', fee: 10 },
  { name: '11번가', fee: 12 },
  { name: '직접입력', fee: null },
];

const $ = (id) => document.getElementById(id);
const els = {
  cost: $('cost'), price: $('price'), fee: $('fee'), shipping: $('shipping'),
  etc: $('etc'), qty: $('qty'), targetMargin: $('targetMargin'),
  cnyAmount: $('cnyAmount'), exchangeRate: $('exchangeRate'),
  forwarding: $('forwarding'), customs: $('customs'),
};

let mode = 'forward';
let costMode = 'direct';
let activePlatform = '직접입력';

function toNumber(str) {
  const n = parseFloat(String(str).replace(/[^0-9.-]/g, ''));
  return isNaN(n) ? 0 : n;
}
function formatWon(n) {
  return Math.round(n).toLocaleString('ko-KR') + '원';
}
function formatInputNumber(el) {
  const raw = toNumber(el.value);
  el.value = raw ? raw.toLocaleString('ko-KR') : '';
}

// 플랫폼 칩 렌더
const chipsWrap = $('platformChips');
PLATFORMS.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'chip' + (p.name === activePlatform ? ' active' : '');
  btn.textContent = p.name;
  btn.type = 'button';
  btn.addEventListener('click', () => {
    activePlatform = p.name;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    if (p.fee !== null) els.fee.value = p.fee;
    calc();
  });
  chipsWrap.appendChild(btn);
});

// 모드 토글
$('modeForward').addEventListener('click', () => setMode('forward'));
$('modeReverse').addEventListener('click', () => setMode('reverse'));
function setMode(m) {
  mode = m;
  $('modeForward').classList.toggle('active', m === 'forward');
  $('modeReverse').classList.toggle('active', m === 'reverse');
  $('priceField').style.display = m === 'forward' ? '' : 'none';
  $('targetMarginField').style.display = m === 'reverse' ? '' : 'none';
  calc();
}

// 원 단위 입력 콤마 포맷
['cost', 'price', 'shipping', 'etc', 'qty'].forEach(id => {
  els[id].addEventListener('input', () => { formatInputNumber(els[id]); calc(); });
});
els.fee.addEventListener('input', calc);
els.targetMargin.addEventListener('input', calc);

// 사입가 계산 방식 (직접입력 / 1688·배대지·통관)
$('costModeDirect').addEventListener('click', () => setCostMode('direct'));
$('costModeImport').addEventListener('click', () => setCostMode('import'));
function setCostMode(m) {
  costMode = m;
  $('costModeDirect').classList.toggle('active', m === 'direct');
  $('costModeImport').classList.toggle('active', m === 'import');
  $('importCostCard').style.display = m === 'import' ? '' : 'none';
  els.cost.readOnly = m === 'import';
  if (m === 'import') updateImportCost();
  calc();
}
function updateImportCost() {
  const cny = toNumber(els.cnyAmount.value);
  const rate = toNumber(els.exchangeRate.value);
  const fwd = toNumber(els.forwarding.value);
  const cus = toNumber(els.customs.value);
  const total = cny * rate + fwd + cus;
  els.cost.value = total ? Math.round(total).toLocaleString('ko-KR') : '';
}
['cnyAmount', 'forwarding', 'customs'].forEach(id => {
  els[id].addEventListener('input', () => { formatInputNumber(els[id]); updateImportCost(); calc(); });
});
els.exchangeRate.addEventListener('input', () => { updateImportCost(); calc(); });

function currentInputs() {
  return {
    cost: toNumber(els.cost.value),
    price: toNumber(els.price.value),
    fee: toNumber(els.fee.value),
    shipping: toNumber(els.shipping.value),
    etc: toNumber(els.etc.value),
    qty: Math.max(1, toNumber(els.qty.value) || 1),
    targetMargin: toNumber(els.targetMargin.value),
  };
}

function calc() {
  const { cost, fee, shipping, etc, qty, targetMargin } = currentInputs();
  let price = currentInputs().price;
  const fixedCost = cost + shipping + etc;
  const errEl = $('calcError');
  errEl.textContent = '';

  if (mode === 'reverse') {
    const denom = 1 - (fee + targetMargin) / 100;
    if (denom <= 0) {
      errEl.textContent = '수수료율과 목표 마진율의 합이 100% 이상이라 계산할 수 없어. 값을 낮춰봐.';
      price = 0;
    } else {
      price = fixedCost / denom;
      els.price.value = price ? Math.round(price).toLocaleString('ko-KR') : '';
    }
  }

  const feeAmount = price * fee / 100;
  const profitPerUnit = price - fixedCost - feeAmount;
  const marginRate = price > 0 ? (profitPerUnit / price) * 100 : 0;
  const totalProfit = profitPerUnit * qty;

  const breakevenDenom = 1 - fee / 100;
  const breakeven = breakevenDenom > 0 ? fixedCost / breakevenDenom : 0;

  $('outMargin').textContent = (marginRate || 0).toFixed(1) + '%';
  $('outBreakeven').textContent = formatWon(breakeven);
  $('statMargin').className = 'stat ' + (marginRate >= 0 ? 'pos' : 'neg');

  $('rbProfit').textContent = formatWon(profitPerUnit);
  $('rbTotal').textContent = `수량 ${qty}개 · 총 ${formatWon(totalProfit)}`;
  $('resultBar').className = 'result-bar ' + (profitPerUnit >= 0 ? 'pos' : 'neg');

  return { price, profitPerUnit, marginRate, totalProfit, qty };
}

// 저장 기능 (localStorage)
const STORAGE_KEY = 'sellerCalcSavedItems';
function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function persistSaved(items) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}
function renderSaved() {
  const items = loadSaved();
  const wrap = $('savedList');
  if (!items.length) {
    wrap.innerHTML = '<div class="empty">아직 저장한 상품이 없어</div>';
    return;
  }
  wrap.innerHTML = '';
  items.slice().reverse().forEach((item) => {
    const row = document.createElement('div');
    row.className = 'saved-item';
    row.innerHTML = `
      <div>
        <div class="si-name">${escapeHtml(item.name)}</div>
        <div class="si-plat">${escapeHtml(item.platform)} · 수수료 ${item.fee}%</div>
      </div>
      <div style="display:flex;align-items:center;">
        <div class="si-right">
          <div class="si-profit" style="color:${item.profit >= 0 ? '#2dce89' : '#f5365c'}">${formatWon(item.profit)}</div>
          <div class="si-margin">마진율 ${item.margin.toFixed(1)}%</div>
        </div>
        <button class="si-del" data-id="${item.id}">×</button>
      </div>
    `;
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('si-del')) return;
      loadItem(item);
    });
    row.querySelector('.si-del').addEventListener('click', (e) => {
      e.stopPropagation();
      const remaining = loadSaved().filter(i => i.id !== item.id);
      persistSaved(remaining);
      renderSaved();
    });
    wrap.appendChild(row);
  });
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function loadItem(item) {
  setMode('forward');
  activePlatform = item.platform;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === item.platform));
  if (item.costMode === 'import') {
    els.cnyAmount.value = (item.cnyAmount || 0).toLocaleString('ko-KR');
    els.exchangeRate.value = item.exchangeRate || '';
    els.forwarding.value = (item.forwarding || 0).toLocaleString('ko-KR');
    els.customs.value = (item.customs || 0).toLocaleString('ko-KR');
    setCostMode('import');
  } else {
    setCostMode('direct');
    els.cost.value = item.cost.toLocaleString('ko-KR');
  }
  els.price.value = item.price.toLocaleString('ko-KR');
  els.fee.value = item.fee;
  els.shipping.value = item.shipping.toLocaleString('ko-KR');
  els.etc.value = item.etc.toLocaleString('ko-KR');
  els.qty.value = item.qty.toLocaleString('ko-KR');
  calc();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function saveCurrent() {
  const name = $('itemName').value.trim();
  if (!name) { $('itemName').focus(); return; }
  const { cost, fee, shipping, etc, qty } = currentInputs();
  const result = calc();
  const items = loadSaved();
  items.push({
    id: Date.now(),
    name,
    platform: activePlatform,
    cost, fee, shipping, etc, qty,
    price: Math.round(result.price),
    profit: Math.round(result.profitPerUnit),
    margin: result.marginRate,
    costMode,
    cnyAmount: toNumber(els.cnyAmount.value),
    exchangeRate: toNumber(els.exchangeRate.value),
    forwarding: toNumber(els.forwarding.value),
    customs: toNumber(els.customs.value),
  });
  persistSaved(items);
  $('itemName').value = '';
  renderSaved();
}
$('saveBtn').addEventListener('click', saveCurrent);
$('rbSaveBtn').addEventListener('click', () => { $('itemName').focus(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); });
$('itemName').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveCurrent(); });
